# One-click public demo on Render (https://render.com): New > Blueprint > pick this repo.
# Set DEMO_PASSWORD and ADMIN_PASSWORD in the dashboard when prompted (never commit them).
services:
  - type: web
    name: blms-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_USERS
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
